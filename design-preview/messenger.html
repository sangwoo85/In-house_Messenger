ansform:translateX(-50%);background:#20344e;color:white;padding:11px 18px;border-radius:9px;font-size:12px;z-index:20;max-width:85vw;box-shadow:0 5px 22px #10203022}.preview-bar{display:flex;justify-content:center;gap:14px;align-items:center;padding:12px;font-size:11px;color:#8491a2}.preview-bar button{font-size:11px;color:#5d7ca9;text-decoration:underline;text-underline-offset:3px}

<body>
<div class="app">
 <aside class="sidebar">
  <div class="brand"><div class="logo" data-icon="messages"></div><h1>Messenger</h1></div>
  <nav class="nav" aria-label="주 메뉴"><button data-view="chat" class="active"><span data-icon="chat"></span><span>대화</span></button><button data-view="people"><span data-icon="users"></span><span>조직</span></button><button data-view="notifications"><span data-icon="bell"></span><span>알림</span></button></nav>
  <div id="sideContent" class="side-content"></div>
  <div class="self"><div class="avatar">상우</div><div><strong>김상우</strong><small>프로덕트팀 · <span class="online-text">온라인</span></small></div></div>
 </aside>
 <main class="workspace">
  <header class="header"><div class="header-title"><div class="avatar" id="headerIcon" data-icon="users"></div><div><h2 id="pageTitle">프로덕트팀</h2><p id="pageSubtitle">멤버 6명</p></div></div><div class="header-tools" id="headerTools"><button class="outline active" id="toggleSchedule" aria-expanded="true" aria-controls="schedulePanel"><span data-icon="calendar"></span><span>일정</span></button><button class="icon-button" id="newSchedule" aria-label="일정 등록" data-icon="plus"></button></div></header>
  <div id="chatView" class="content">
   <section class="conversation" aria-label="대화방">
    <div class="notice"><span data-icon="pin"></span><span>팀의 일정과 공유 자료를 이곳에서 함께 확인하세요.</span></div>
    <button class="schedule-strip" id="scheduleStrip"></button>
    <div id="history" class="history" role="log" aria-label="대화 내용" aria-live="polite"></div>
    <form class="composer" id="chatForm"><div class="inputbox"><textarea id="messageInput" aria-label="메시지 작성" placeholder="메시지를 입력하세요" maxlength="3000"></textarea><div class="compose-tools"><label class="file-label"><span data-icon="clip"></span>파일<input id="fileInput" type="file" hidden></label><button type="button" class="icon-button" id="composeSchedule" aria-label="대화방 일정 등록" data-icon="calendar"></button><small>Enter로 전송 · Shift + Enter로 줄바꿈</small><button class="primary send" id="sendButton" disabled>전송</button></div></div></form>
   </section>
   <aside id="schedulePanel" class="schedule-panel" aria-label="대화방 일정"><div class="panel-head"><h3>대화방 일정</h3><button class="icon-button" id="closePanel" aria-label="일정 패널 닫기" data-icon="close"></button></div><div class="panel-body"><button class="primary" id="panelNew"><span data-icon="plus"></span>새 일정 등록</button><div class="section-label">예정된 일정</div><div id="eventList"></div><p class="panel-hint">회의와 일정 알림을 위한 디자인 시안입니다.<br>일정 알림 팝업의 디자인을 미리 볼 수 있습니다.</p><button class="muted-button" id="panelPreview">팝업 미리보기 ↗</button></div></aside>
  </div>
  <section id="peopleView" class="people-view" hidden><label class="searchbox"><span data-icon="search"></span><input id="peopleSearch" placeholder="이름 또는 부서로 검색" aria-label="사용자 검색"></label><div class="people-heading"><span id="peopleHeading">전체 구성원 8</span><small>이름순</small></div><div id="peopleList"></div></section>
  <section id="notificationsView" class="notifications-view" hidden><div id="notificationList"></div></section>
 </main>
</div>
<footer class="preview-bar"><span>디자인 전용 · 더미 데이터 · 서버 연결 및 저장 없음</span><button id="previewPopup">팝업 미리보기</button></footer>
<dialog id="eventDialog" aria-labelledby="dialogTitle"><div class="modal-head"><h2 id="dialogTitle">새 일정 등록</h2><button class="icon-button" id="closeDialog" aria-label="일정 등록 닫기" data-icon="close"></button></div><p class="modal-room"><span data-icon="users"></span><span id="dialogRoom"></span></p><form id="eventForm" class="event-form"><label class="field">일정 제목<input id="eventTitle" maxlength="70" required placeholder="예: 디자인 리뷰 회의"></label><div class="field-row"><label class="field">시작 날짜<input id="eventDate" type="date" required></label><label class="field">시작 시간<input id="eventTime" type="time" required></label></div><div class="field-row"><label class="field">종료 날짜<input id="eventEndDate" type="date" required></label><label class="field">종료 시간<input id="eventEndTime" type="time" required></label></div><label class="field">장소 유무<select id="eventHasLocation"><option value="none">장소 없음</option><option value="yes">장소 있음</option></select></label><label class="field" id="locationField" hidden>미팅 장소<select id="eventLocation" disabled><option value="">회의실을 선택하세요</option><option>7층 중 회의실</option><option>8층 중 회의실</option></select></label><div class="field-row"><label class="field">알림 시점<select id="eventLead"><option value="0">정시</option><option value="5">5분 전</option><option value="10" selected>10분 전</option><option value="30">30분 전</option><option value="60">1시간 전</option></select></label><label class="field">알림 대상<select id="eventAudience"><option value="room">대화방 전체</option><option value="self">나에게만</option></select></label></div><div class="form-note">디자인 확인용 입력창입니다. 입력 내용은 새로고침하면 초기화되며, 실제 일정이나 알림은 등록되지 않습니다.</div><p class="form-error" id="formError" role="alert" hidden></p><div class="modal-footer"><button type="button" class="outline" id="cancelDialog">취소</button><button class="primary" id="saveEvent">일정 등록</button></div></form></dialog>
<aside class="notification-popup" id="popup" aria-label="일정 알림" role="alert" hidden><div class="popup-progress"></div><div class="popup-top"><span data-icon="bell"></span><span id="popupRoom"></span><button class="icon-button" id="popupClose" aria-label="알림 닫기" data-icon="close"></button></div><h3 id="popupTitle"></h3><p id="popupDescription"></p><p id="popupDetails"></p><div class="popup-actions"><button class="primary" id="popupOpen">대화방 열기</button><button class="outline" id="popupSnooze">5분 뒤 알림</button></div></aside>
<div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const paths={messages:'<path d="M14 3H4a2 2 0 0 0-2 2v12l4-4h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Z"/><path d="M20 8h1a1 1 0 0 1 1 1v13l-4-4h-7a2 2 0 0 1-2-2"/>',chat:'<path d="M21 11a8 8 0 0 1-8 8H6l-4 3V11a9 9 0 0 1 19 0Z"/>',users:'<circle cx="9" cy="7" r="3"/><path d="M3 21v-4a5 5 0 0 1 10 0v4m3-18a3 3 0 0 1 0 6m1 4a5 5 0 0 1 4 5v3"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 4h2m4 0h2m-8 3h2"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M9 21h6"/>',plus:'<path d="M12 5v14M5 12h14"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',clip:'<path d="m8 13 7-7a3 3 0 0 1 4 4L9 20a5 5 0 0 1-7-7L13 2m-7 13 9-9"/>',pin:'<path d="m9 3 6 0-1 6 4 4v2H6v-2l4-4-1-6Zm3 12v7"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Zm0 0v6h6M8 13h8m-8 4h6"/>',arrow:'<path d="m9 5 7 7-7 7"/>'};
const $=id=>document.getElementById(id);const icon=n=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+(paths[n]||paths.chat)+'</svg>';document.querySelectorAll('[data-icon]').forEach(n=>n.innerHTML=icon(n.dataset.icon));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);const key='messenger-design-schedules-v1';
const rooms=[{id:'product',name:'프로덕트팀',members:6,preview:'이지은: 네, 그럼 회의 때 뵐게요!',time:'오후 2:34'},{id:'dev',name:'개발팀',members:3,preview:'오늘 배포 일정 공유드립니다.',time:'오전 11:20'},{id:'all',name:'전체 공지',members:8,preview:'9월 정기 회의 안내',time:'어제'}];
const people=[['김도윤','개발팀','프론트엔드 개발','온라인'],['김상우','프로덕트팀','서비스 기획','온라인'],['박서연','프로덕트팀','프로덕트 매니저','자리 비움'],['오민준','개발팀','백엔드 개발','온라인'],['윤수빈','경영지원팀','인사 · 총무','오프라인'],['이지은','디자인팀','프로덕트 디자인','온라인'],['정하린','디자인팀','브랜드 디자인','자리 비움'],['최현우','개발팀','인프라 개발','오프라인']];
let currentRoom='product',view='chat',department='전체 구성원',editing=null,dialogRoom='product',panelOpen=true,popupItem=null,popupQueue=[],toastTimer,testTimer=null,drafts={};
function sampleMessages(){return [{name:'이지은',team:'디자인팀',text:'오후 리뷰 때 볼 자료 공유드려요 🙂\n지난번에 이야기한 내용까지 정리했어요.',time:'오후 2:30'},{own:true,text:'감사해요. 회의 전에 확인할게요!',time:'오후 2:31'},{name:'김도윤',team:'개발팀',text:'개발 검토 내용도 함께 올려둘게요.',file:'메신저_화면설계_v2.pdf',time:'오후 2:32'},{own:true,text:'좋아요. 오늘은 대화 흐름과 파일 공유 위주로 보면 좋겠어요.',time:'오후 2:33',unread:2},{name:'이지은',team:'디자인팀',text:'네, 그럼 회의 때 뵐게요!',time:'오후 2:34'}];}
function initial(){const at=Math.ceil((Date.now()+3600000)/60000)*60000;return {events:[{id:uid(),room:'product',title:'디자인 리뷰 회의',at,endAt:at+3600000,lead:10,audience:'room',hasLocation:true,location:'7층 중 회의실',owner:'김상우',fired:false}],messages:{product:sampleMessages(),dev:[],all:[]},notices:[{id:'sample-notice',room:'product',roomName:'프로덕트팀',title:'디자인 리뷰 회의',at:at,description:'회의가 10분 뒤 시작됩니다. · 더미 알림',received:Date.now()}],snoozes:[]};}
let state=initial();
function save(){}
function roomName(id){return rooms.find(r=>r.id===id)?.name||(id.startsWith('dm:')?id.slice(3):'대화방');}
function ensureRoom(id){if(!rooms.some(r=>r.id===id))rooms.push({id,name:roomName(id),members:2,preview:'대화를 시작해 보세요.',time:''});}
for(const id of Object.keys(state.messages))ensureRoom(id);for(const e of state.events)ensureRoom(e.room);
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3600);}
function timeLabel(at){return new Date(at).toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'});}
function dateLabel(at){const d=new Date(at);return d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'})+' · '+timeLabel(at);}
function leadLabel(e){return e.lead?e.lead+'분 전':'정시';}
function go(next,room){if(view==='chat')drafts[currentRoom]=$('messageInput').value;if(room){currentRoom=room;ensureRoom(room);}view=next;document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false');});$('chatView').hidden=view!=='chat';$('peopleView').hidden=view!=='people';$('notificationsView').hidden=view!=='notifications';$('headerTools').hidden=view!=='chat';$('headerIcon').hidden=view!=='chat';$('pageTitle').textContent=view==='chat'?roomName(currentRoom):view==='people'?'사용자 목록':'알림';$('pageSubtitle').textContent=view==='chat'?'멤버 '+(rooms.find(r=>r.id===currentRoom)?.members||2)+'명':view==='people'?'함께 일하는 동료를 찾아보세요.':'회의와 일정 알림을 한곳에서 확인하세요.';renderSidebar();if(view==='chat'){$('messageInput').value=drafts[currentRoom]||'';updateSend();renderChat();renderSchedules();setPanel(panelOpen);}if(view==='people')renderPeople();if(view==='notifications')renderNotifications();}
function renderSidebar(){const side=$('sideContent');if(view==='people'){const depts=['전체 구성원',...new Set(people.map(p=>p[1]))];side.innerHTML='<div class="side-label">조직</div>'+depts.map(d=>'<button class="department '+(d===department?'active':'')+'" data-department="'+esc(d)+'">'+esc(d)+'<span>'+people.filter(p=>d==='전체 구성원'||p[1]===d).length+'</span></button>').join('');side.querySelectorAll('[data-department]').forEach(b=>b.onclick=()=>{department=b.dataset.department;renderSidebar();renderPeople();});return;}side.innerHTML='<div class="side-label"><span>대화 목록</span><span>'+rooms.length+'</span></div>'+rooms.map(r=>'<button class="room '+(r.id===currentRoom?'active':'')+'" data-room="'+esc(r.id)+'"><div class="avatar">'+(r.id.startsWith('dm:')?esc(r.name.slice(1)):'#')+'</div><div class="room-copy"><strong>'+esc(r.name)+'</strong><small>'+esc(r.preview)+'</small></div><span class="room-time">'+esc(r.time)+'</span></button>').join('');side.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>go('chat',b.dataset.room));}
function renderChat(){const messages=state.messages[currentRoom]||[];$('history').innerHTML='<div class="date">'+new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'})+'</div>'+(!messages.length?'<div class="empty">아직 대화가 없습니다.<br>첫 메시지를 보내보세요.</div>':'')+messages.map(m=>{if(m.system)return '<div class="system-message">'+esc(m.text)+'</div>';const meta='<div class="meta">'+(m.unread?'<span class="unread">'+Number(m.unread)+'</span>':'')+esc(m.time||'')+'</div>';return '<div class="message '+(m.own?'own':'')+'">'+(!m.own?'<div class="avatar">'+esc((m.name||'사용자').slice(1))+'</div>':'')+'<div class="stack">'+(!m.own?'<div class="sender">'+esc(m.name)+'<small>'+esc(m.team||'')+'</small></div>':'')+'<div class="bubble-line">'+(m.own?meta:'')+'<div class="bubble">'+esc(m.text)+'</div>'+(!m.own&&!m.file?meta:'')+'</div>'+(m.file?'<div class="bubble-line"><div class="file-card"><span class="file-icon">'+icon('file')+'</span><div><strong>'+esc(m.file)+'</strong><small>첨부파일 · 디자인 미리보기</small></div></div>'+meta+'</div>':'')+'</div></div>';}).join('');}
function addSystem(room,text){(state.messages[room]??=[]).push({system:true,text});if(view==='chat'&&currentRoom===room)renderChat();}
function updateSend(){$('sendButton').disabled=!$('messageInput').value.trim();}
$('messageInput').oninput=updateSend;$('messageInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('chatForm').requestSubmit();}};
$('chatForm').onsubmit=e=>{e.preventDefault();const text=$('messageInput').value.trim();if(!text)return;(state.messages[currentRoom]??=[]).push({own:true,text,time:timeLabel(Date.now())});$('messageInput').value='';drafts[currentRoom]='';updateSend();rooms.find(r=>r.id===currentRoom).preview=text;save();renderSidebar();renderChat();$('history').scrollTop=$('history').scrollHeight;};
$('fileInput').onchange=e=>{const file=e.target.files[0];if(!file)return;(state.messages[currentRoom]??=[]).push({own:true,text:'파일을 공유했습니다.',file:file.name,time:timeLabel(Date.now())});save();renderChat();$('history').scrollTop=$('history').scrollHeight;toast('파일 이름만 시안에 표시했습니다. 파일은 업로드되지 않습니다.');e.target.value='';};
function setPanel(open){panelOpen=open;$('schedulePanel').hidden=!open;$('toggleSchedule').classList.toggle('active',open);$('toggleSchedule').setAttribute('aria-expanded',String(open));}
function renderSchedules(){const list=state.events.filter(e=>e.room===currentRoom&&e.at>=Date.now()-60000).sort((a,b)=>a.at-b.at);$('eventList').innerHTML=list.length?list.map(e=>'<article class="event-card"><div class="event-date">'+icon('calendar')+esc(eventRange(e))+'</div><h3>'+esc(e.title)+'</h3><div class="event-detail">'+esc(e.location||'장소 없음')+'<br>'+leadLabel(e)+' 알림 · '+(e.audience==='room'?'방 전체':'나에게만')+'</div><div class="event-footer"><small>'+esc(e.owner)+' 등록</small>'+(e.owner==='김상우'?'<div class="event-actions"><button data-edit="'+esc(e.id)+'">수정</button><button data-delete="'+esc(e.id)+'" class="danger">취소</button></div>':'')+'</div></article>').join(''):'<div class="empty">예정된 일정이 없어요.<br>팀의 다음 일정을 등록해 보세요.</div>';$('eventList').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEvent(b.dataset.edit));$('eventList').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>cancelEvent(b.dataset.delete));const first=list[0];$('scheduleStrip').innerHTML='<span class="calendar-mini">'+icon('calendar')+'</span><span class="strip-copy"><strong>'+esc(first?first.title:'다음 회의, 잊지 않도록')+'</strong><small>'+esc(first?eventRange(first)+' · '+(first.location||'장소 없음'):'이 방에 일정을 등록하고 알림을 받아보세요.')+'</small></span><span class="strip-status">'+(first?leadLabel(first)+' 알림':'일정 등록')+'</span>'+icon('arrow');$('scheduleStrip').onclick=()=>{if(first)setPanel(true);else openEvent();};}
function localDate(at){const d=new Date(at);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function eventRange(e){if(!e.endAt)return dateLabel(e.at);return dateLabel(e.at)+' – '+(localDate(e.at)===localDate(e.endAt)?timeLabel(e.endAt):dateLabel(e.endAt));}
function updateLocation(){const has=$('eventHasLocation').value==='yes';$('locationField').hidden=!has;$('eventLocation').disabled=!has;$('eventLocation').required=has;if(!has)$('eventLocation').value='';}
$('eventHasLocation').onchange=updateLocation;

function openEvent(id){const ev=id?state.events.find(e=>e.id===id):null;if(id&&(!ev||ev.owner!=='김상우'))return;editing=ev?.id||null;dialogRoom=ev?.room||currentRoom;const at=ev?.at||Math.ceil((Date.now()+3600000)/60000)*60000;const d=new Date(at);$('eventForm').reset();$('dialogTitle').textContent=ev?'일정 수정':'새 일정 등록';$('saveEvent').textContent=ev?'변경 저장':'일정 등록';$('dialogRoom').textContent=roomName(dialogRoom);$('eventTitle').value=ev?.title||'';$('eventHasLocation').value=ev?.location?'yes':'none';$('eventLocation').value=ev?.location||'';updateLocation();const end=new Date(ev?.endAt||at+3600000);$('eventEndDate').value=localDate(end);$('eventEndTime').value=String(end.getHours()).padStart(2,'0')+':'+String(end.getMinutes()).padStart(2,'0');$('eventDate').value=localDate(at);$('eventDate').min=localDate(Date.now());$('eventTime').value=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');$('eventLead').value=String(ev?.lead??10);$('eventAudience').value=ev?.audience||'room';$('formError').hidden=true;$('eventDialog').showModal();$('eventTitle').focus();}
$('eventForm').onsubmit=e=>{e.preventDefault();const at=new Date($('eventDate').value+'T'+$('eventTime').value).getTime();const title=$('eventTitle').value.trim();if(!title||!Number.isFinite(at)||at<=Date.now()){$('formError').textContent='제목을 입력하고 현재보다 이후의 시간을 선택해 주세요.';$('formError').hidden=false;return;}const endAt=new Date($('eventEndDate').value+'T'+$('eventEndTime').value).getTime();if(!Number.isFinite(endAt)||endAt<=at){$('formError').textContent='종료 시간은 시작 시간보다 늦어야 합니다.';$('formError').hidden=false;return;}const existing=editing?state.events.find(x=>x.id===editing):null;if(editing&&!existing){toast('일정을 찾을 수 없습니다.');return;}const ev={id:editing||uid(),room:dialogRoom,title,at,endAt,hasLocation:$('eventHasLocation').value==='yes',lead:Number($('eventLead').value),audience:$('eventAudience').value,location:$('eventHasLocation').value==='yes'?$('eventLocation').value:'',owner:'김상우',fired:false};if(existing){state.events=state.events.map(x=>x.id===editing?ev:x);state.snoozes=state.snoozes.filter(x=>x.eventId!==editing);popupQueue=popupQueue.filter(x=>x.eventId!==editing);if(popupItem?.eventId===editing)dismissPopup();}else state.events.push(ev);if(ev.audience==='room'||existing?.audience==='room')addSystem(ev.room,'김상우님이 '+(existing?'일정을 변경했습니다':'일정을 등록했습니다')+' · '+ev.title+' · '+eventRange(ev));save();$('eventDialog').close();renderSchedules();setPanel(true);toast(existing?'시안의 일정 표시를 변경했습니다.':'시안에 일정을 추가했습니다. 실제 알림은 예약되지 않습니다.');tick();};
function cancelEvent(id){const ev=state.events.find(x=>x.id===id);if(!ev||ev.owner!=='김상우')return;state.events=state.events.filter(x=>x.id!==id);state.snoozes=state.snoozes.filter(x=>x.eventId!==id);popupQueue=popupQueue.filter(x=>x.eventId!==id);if(popupItem?.eventId===id)dismissPopup();if(ev.audience==='room')addSystem(ev.room,'김상우님이 일정을 취소했습니다 · '+ev.title);save();renderSchedules();toast('일정을 취소했습니다.');}
function renderPeople(){const query=$('peopleSearch').value.trim();const filtered=people.filter(p=>(department==='전체 구성원'||p[1]===department)&&(!query||(p[0]+' '+p[1]).includes(query)));$('peopleHeading').textContent=department+' '+filtered.length;$('peopleList').innerHTML=filtered.map(p=>'<div class="person-row"><div class="avatar">'+esc(p[0].slice(1))+'<span class="status-dot" style="background:'+(p[3]==='온라인'?'#50ac87':p[3]==='자리 비움'?'#d5a54b':'#a6b0bf')+'"></span></div><div class="person-info"><strong>'+esc(p[0])+(p[0]==='김상우'?' (나)':'')+'</strong><small>'+esc(p[1])+'</small></div><div class="person-role">'+esc(p[2])+'</div><div class="person-state">'+p[3]+'</div><button class="outline" data-person="'+esc(p[0])+'">'+(p[0]==='김상우'?'나와의 대화':'대화하기')+'</button></div>').join('')||'<div class="empty">검색 결과가 없습니다.</div>';$('peopleList').querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>go('chat','dm:'+b.dataset.person));}
function renderNotifications(){$('notificationList').innerHTML=state.notices.length?[...state.notices].reverse().map(n=>'<article class="notification-card"><span class="calendar-mini">'+icon('bell')+'</span><div class="details"><h3>'+esc(n.title)+'</h3><p>'+esc(n.roomName)+' · '+esc(dateLabel(n.at))+'</p><p>'+esc(n.description)+'</p><button class="outline" data-notice="'+esc(n.id)+'">대화방 열기</button></div><small>'+esc(timeLabel(n.received))+'</small></article>').join(''):'<div class="empty">아직 받은 알림이 없습니다.<br>등록한 일정의 알림이 여기에 쌓입니다.</div>';$('notificationList').querySelectorAll('[data-notice]').forEach(b=>b.onclick=()=>{const n=state.notices.find(x=>x.id===b.dataset.notice);if(n)go('chat',n.room);});}
function eventNotice(ev,extra={}){const missed=Date.now()>ev.at;return {id:uid(),eventId:ev.id,room:ev.room,roomName:roomName(ev.room),title:ev.title,at:ev.at,endAt:ev.endAt,location:ev.location,description:missed?'놓친 일정 알림입니다.':ev.lead?'일정 시작 '+ev.lead+'분 전 알림입니다.':'일정이 시작됩니다.',received:Date.now(),...extra};}
function showNext(){if(popupItem||!popupQueue.length)return;popupItem=popupQueue.shift();$('popupRoom').textContent=popupItem.roomName+' · '+(popupItem.demo?'미리보기':'일정 알림');$('popupTitle').textContent=popupItem.title;$('popupDescription').textContent=popupItem.description;$('popupDetails').textContent=eventRange(popupItem)+' · '+(popupItem.location||'장소 없음');$('popup').hidden=false;}
function dismissPopup(){popupItem=null;$('popup').hidden=true;showNext();}
$('popupClose').onclick=dismissPopup;$('popupOpen').onclick=()=>{if(!popupItem)return;const room=popupItem.room;dismissPopup();go('chat',room);setPanel(true);};
$('popupSnooze').onclick=()=>{dismissPopup();toast('다시 알림 선택 상태입니다. 실제 알림은 예약되지 않습니다.');};
function tick(){}
function preview(){const ev=state.events.find(e=>e.room===currentRoom&&e.at>Date.now())||{id:uid(),room:currentRoom,title:'디자인 리뷰 회의',at:Date.now()+600000,lead:10,location:'회의실 A'};popupQueue.push(eventNotice(ev,{demo:true,description:'회의가 10분 뒤 시작됩니다. (미리보기)'}));showNext();}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));$('peopleSearch').oninput=renderPeople;$('toggleSchedule').onclick=()=>setPanel(!panelOpen);$('closePanel').onclick=()=>setPanel(false);for(const id of ['newSchedule','panelNew','composeSchedule'])$(id).onclick=()=>openEvent();for(const id of ['closeDialog','cancelDialog'])$(id).onclick=()=>$('eventDialog').close();$('eventDialog').addEventListener('click',e=>{if(e.target===$('eventDialog')){const r=$('eventDialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('eventDialog').close();}});$('previewPopup').onclick=preview;$('panelPreview').onclick=preview;go('chat');
</script>
</body>
</html>
