map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name messenger.sangwoo.site localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 52m;

    # Internal integration endpoints are not part of the public messenger.
    location ^~ /api/v1/internal { return 404; }

    location /api/ {
        proxy_pass http://host.docker.internal:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cookie_flags refreshToken secure httponly samesite=strict;
    }

    location = /ws {
        proxy_pass http://host.docker.internal:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
    }

    location = /actuator/health {
        proxy_pass http://host.docker.internal:8083;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html { add_header Cache-Control "no-store"; }
    location / { try_files $uri $uri/ /index.html; }
}
