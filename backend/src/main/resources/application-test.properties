spring.datasource.url=jdbc:h2:mem:messenger;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.username=${REDIS_USERNAME:messenger_user}
spring.data.redis.password=${REDIS_PASSWORD:1234}
app.auth.cookie-secure=false
app.security.jwt-secret=change-me-change-me-change-me-change-me
app.security.internal-api-key=change-me
app.external.auth-base-url=http://localhost:9090
app.external.auth-timeout-seconds=3
app.external.auth-login-path=/api/v1/login
app.external.user-list-path=/api/v1/getUserList
app.file.storage-path=target/test-uploads
app.web.allowed-origins=http://localhost:*,http://127.0.0.1:*
