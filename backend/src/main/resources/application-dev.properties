# Support both the repository root (IntelliJ auto-generated run) and backend working directories.
# An explicit MESSENGER_CONFIG or backend-local config takes precedence over the root fallback.
spring.config.import=optional:file:./backend/config/messenger.properties,optional:file:${MESSENGER_CONFIG:./config/messenger.properties}
server.port=${BACKEND_PORT:8082}
spring.datasource.url=${JDBC_URL:jdbc:mysql://localhost:3306/company_messenger?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
spring.datasource.username=${JDBC_USERNAME:root}
spring.datasource.password=${JDBC_PASSWORD:1234}
# Select the driver from jdbc:mysql: or jdbc:mariadb: automatically.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:messenger_user}
spring.data.redis.password=${REDIS_PASSWORD:1234}
app.auth.cookie-secure=false
app.security.jwt-secret=${JWT_SECRET:change-me-change-me-change-me-change-me}
app.security.internal-api-key=${INTERNAL_API_KEY:change-me}
app.external.auth-base-url=${INTERNAL_AUTH_BASE_URL:http://localhost:9090}
app.external.auth-timeout-seconds=3
# Local Usersdummy uses id/name/dept and a status-only login. Production defaults to emprId.
app.external.legacy-user-api=true
app.external.auth-login-path=${INTERNAL_AUTH_LOGIN_PATH:/api/v1/login}
app.external.user-list-path=${INTERNAL_AUTH_USER_LIST_PATH:/api/v1/getUserList}
app.file.storage-path=${FILE_STORAGE_PATH:./uploads}
app.web.allowed-origins=http://localhost:*,http://127.0.0.1:*
