spring.application.name=messenger
spring.profiles.default=dev
spring.jackson.serialization.write-dates-as-timestamps=false
spring.data.redis.repositories.enabled=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB
app.auth.access-token-expiration-minutes=15
app.auth.refresh-token-expiration-days=7
app.file.image-max-bytes=10485760
app.file.other-max-bytes=52428800
management.endpoints.web.exposure.include=health
# Bounded directory response and profile images keep memory use predictable on intranet servers.
app.external.max-response-bytes=4194304
app.profile.image-max-bytes=5242880
app.profile.image-max-dimension=4096
